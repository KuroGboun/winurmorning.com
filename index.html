<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: without it iOS keeps the content OUT of the notch and
     home-indicator strips and fills them with the page background colour, which
     is exactly the blue band that showed above and below the sky. The nav pads
     itself back off the safe areas below. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Win Your Morning</title>
<meta name="description" content="Your friends are the alarm clock. Make your promises the night before, prove it with a photo by the deadline, or wake up as Bum of the Day.">

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<!-- SAMPLED from the rendered page's top edge (#3A689C), not picked off the
     gradient by eye. Safari tints its status bar with this, so any drift from
     the real top pixel shows up as a band — which is what #6FA3DA was doing:
     a much lighter blue sitting directly above much darker sky. The scrim in
     the CSS pins the top of the page to this exact colour so the two can't
     drift apart as the video plays. -->
<meta name="theme-color" content="#3A689C">

<meta property="og:type" content="website">
<meta property="og:title" content="Win Your Morning">
<meta property="og:description" content="Your friends are the alarm clock. Make your promises the night before, prove it with a photo by the deadline, or wake up as Bum of the Day.">
<meta property="og:url" content="https://winurmorning.com/">
<meta property="og:image" content="https://winurmorning.com/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Win Your Morning">
<meta name="twitter:description" content="Your friends are the alarm clock. Prove your morning by the deadline — or wake up as Bum of the Day.">
<meta name="twitter:image" content="https://winurmorning.com/assets/og.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,300;10..48,400;10..48,500;10..48,600;10..48,700;10..48,800&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box}
  :root{
    --ink:#1E2A24; --cream:#F4ECD8; --gold:#E0A032; --amber:#F2B84B; --terra:#C4562F;
    --cta:#E0A032; --cta-text:#1E2A24; --cta-hover:#F2B84B;
    /* Primary = the display face (the wordmark, the hero, the App Store
       badge's two lines); secondary = system text for the nav and for the
       one real sentence on the page, the tagline. */
    --font-primary:'Bricolage Grotesque',sans-serif;
    --font-secondary:-apple-system,'SF Pro Text',system-ui,sans-serif;
  }
  /* ONE screen, no scroll — the hero IS the page. The how-it-works and FAQ
     sections were pulled back out on 2026-08-19; they land later. */
  html,body{margin:0; height:100%; overflow:hidden}
  /* The body carries the SAME gradient as the hero, not a flat blue. Safari's
     rubber-band overscroll paints the body behind the page, and a flat colour
     there read as blue bands top and bottom. */
  body{font-family:var(--font-secondary); color:var(--cream);
       background:linear-gradient(178deg,#6FA3DA 0%,#4C86C6 30%,#8DB8E4 68%,#CFE0F1 100%);
       -webkit-font-smoothing:antialiased; overscroll-behavior:none}
  a{text-decoration:none}

  /* FIXED, not 100svh. `svh` is the SMALL viewport height — the page measured
     as if Safari's chrome were always expanded — so the moment that chrome
     collapsed the visible area grew taller than the hero and the body showed
     through above and below. A fixed inset:0 box is pinned to the viewport
     itself, so it stays exactly full-bleed through every chrome transition. */
  .hero{position:fixed; inset:0; overflow:hidden; display:flex; flex-direction:column;
        background:linear-gradient(178deg,#6FA3DA 0%,#4C86C6 30%,#8DB8E4 68%,#CFE0F1 100%)}

  /* The sky is real footage; the gradient above is its poster AND its fallback,
     so a blocked or still-loading video leaves the same composition behind. */
  /* Sized to COVER without relying on object-fit. Safari letterboxes a video
     laid out with inset:0 + object-fit:cover — a 16:9 clip in a portrait
     viewport got centred with the blue gradient banding above and below it,
     which is what read as bezels on the phone. The min-width/min-height + auto
     pair is the technique object-fit was meant to replace and that Safari has
     always honoured: the clip grows until it overflows BOTH axes and the
     centring transform crops the excess evenly. scale() then pushes in a little
     further, so no subpixel sliver of gradient can ever reach an edge. */
  .herovid{position:absolute; top:50%; left:50%;
           min-width:100%; min-height:100%; width:auto; height:auto;
           transform:translate(-50%,-50%) scale(1.06);
           z-index:0; pointer-events:none}
  .wash{position:absolute; inset:0; z-index:1; pointer-events:none;
        background:linear-gradient(178deg,rgba(76,134,198,.62) 0%,rgba(76,134,198,.5) 34%,
                  rgba(141,184,228,.42) 70%,rgba(207,224,241,.5) 100%)}

  /* Pins the very top of the page to the SAME colour as `theme-color`, fading
     out over 200px. Without it the top pixel is whatever the video happens to
     be showing on that frame, so the seam against Safari's status bar drifted
     as the clouds moved. Doubles as a little contrast under the nav. */
  .hero::before{content:''; position:absolute; top:0; left:0; right:0; height:200px; z-index:3;
                pointer-events:none;
                background:linear-gradient(to bottom,#3A689C 0%,rgba(58,104,156,.55) 42%,rgba(58,104,156,0) 100%)}

  .cloud{position:absolute; border-radius:50%; z-index:2; pointer-events:none}
  .c1{left:-60px; top:120px; width:460px; height:240px; background:rgba(255,255,255,.22); filter:blur(38px)}
  .c2{right:-80px; top:300px; width:560px; height:300px; background:rgba(255,255,255,.2);  filter:blur(46px)}
  .c3{left:18%; bottom:20px; width:62%; height:320px; background:rgba(255,255,255,.28); filter:blur(56px)}

  /* Everything readable rides above the weather. */
  .frame{position:relative; z-index:7; flex:1; display:flex; flex-direction:column;
         width:100%; max-width:1440px; margin:0 auto}

  /* The nav is FULL WIDTH — deliberately outside the 1440 frame that centres
     the wordmark. Boxed into that frame, the logo and CTA drifted inward on
     anything wider than 1440 (on a 1920 screen they sat ~284px off the edge);
     now they hug the viewport with a fixed gutter no matter how wide it gets.
     The sky already runs edge to edge under the notch (viewport-fit=cover);
     only the content steps back off it. */
  .nav{position:relative; z-index:7; display:flex; align-items:center; justify-content:space-between;
       padding:calc(26px + env(safe-area-inset-top)) calc(28px + env(safe-area-inset-right))
               26px calc(28px + env(safe-area-inset-left))}
  .brand{display:flex; align-items:center; gap:13px; color:var(--cream)}
  .brand span{font-family:var(--font-primary); font-size:14px; font-weight:800;
              letter-spacing:-.01em; line-height:.9}
  .nav-links{display:flex; align-items:center; gap:34px}
  .nav-link{font-family:var(--font-secondary); font-size:15px; font-weight:500;
            color:rgba(244,236,216,.9); transition:color .16s ease}
  .nav-link:hover{color:var(--cream)}
  .nav-cta{font-family:var(--font-secondary); font-size:15px; font-weight:700;
           color:var(--cream); transition:opacity .16s ease}
  .nav-cta:hover{opacity:.82}

  /* The board pins the copy with a top padding rather than centring it, which
     lands the block a touch ABOVE the middle. Reproduced as centring plus a
     bottom bias so it holds that proportion at any viewport height, not just
     at the mock's fixed one. */
  .content{flex:1; display:flex; flex-direction:column; align-items:center;
           justify-content:center; text-align:center; padding:0 72px 8vh}
  h1{margin:0; font-family:var(--font-primary); font-size:clamp(44px,5vw,72px);
     font-weight:800; line-height:.88; letter-spacing:-.045em; color:var(--cream)}
  .squiggle{display:block; margin-top:14px; width:220px; height:auto}

  /* The only full sentence on the page, so it takes the SYSTEM face — the
     design system's two-voices rule (a sentence someone reads is never the
     display face). Sits between the squiggle and the badge. */
  .tagline{margin:20px 0 0; font-family:var(--font-secondary); font-size:20px;
           font-weight:500; color:rgba(244,236,216,.82)}

  /* Badge geometry is the board's, not invented: 8/16 padding on an 11px
     radius, and the taller 24x28 Apple mark rather than the squarer 24x24 one
     — it reads far closer to Apple's real badge than the letterspaced
     all-caps version this replaced. Both lines are the display face now. */
  .appstore{display:inline-flex; align-items:center; gap:8px; margin-top:28px;
            padding:8px 16px; border-radius:11px;
            background:var(--cta); color:var(--cta-text);
            transition:background .16s ease, transform .16s ease}
  .appstore:hover{background:var(--cta-hover); transform:translateY(-1px)}
  .appstore:active{transform:translateY(0)}
  .appstore svg{width:17px; height:21px; flex:none}
  .as-stack{display:flex; flex-direction:column; line-height:1; text-align:left}
  .as-pre{font-family:var(--font-primary); font-size:8px; font-weight:600;
          letter-spacing:-.005em}
  .as-name{font-family:var(--font-primary); font-size:15px; font-weight:700;
           letter-spacing:-.015em; margin-top:2px}

  /* ── Phone (board: Landing Page REAL v2 Mobile) ── two clouds instead of
        three, brand + "Get the app" only, and a tighter button. ── */
  @media (max-width:640px){
    .nav{padding:calc(20px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
                 0 calc(18px + env(safe-area-inset-left))}
    .brand{gap:10px}
    .brand span{font-size:11px}
    .nav-link{display:none}
    .nav-cta{font-size:13px}

    .c1{left:-70px; top:130px; width:300px; height:180px; background:rgba(255,255,255,.2); filter:blur(34px)}
    .c2{right:-80px; top:auto; bottom:90px; width:340px; height:220px; background:rgba(255,255,255,.24); filter:blur(44px)}
    .c3{display:none}

    .content{padding:0 20px calc(10vh + env(safe-area-inset-bottom))}
    h1{font-size:clamp(40px,13.3vw,52px)}
    .squiggle{width:160px; margin-top:12px; stroke-width:11}
    .tagline{margin-top:16px; font-size:16px}
    /* Same badge, padded out to a real touch target. The board's desktop
       geometry comes to ~41px tall, under the 44px floor — so the phone keeps
       its type and radius and only buys back the height. */
    .appstore{margin-top:30px; min-height:46px; padding:11px 20px}
    .appstore svg{width:16px; height:20px}
    .as-name{font-size:14px}
  }

  /* Short laptops: keep the whole composition on the one screen it has. */
  @media (min-width:641px) and (max-height:720px){
    h1{font-size:clamp(38px,4vw,56px)}
    .tagline{margin-top:16px; font-size:18px}
    .appstore{margin-top:22px}
    .content{padding-bottom:4vh}
  }

  /* No motion for anyone who asked not to have it — the sky stays a gradient. */
  @media (prefers-reduced-motion: reduce){
    .herovid{display:none}
  }
</style>
</head>
<body>

<section class="hero">
  <video class="herovid" id="heroVid" muted loop autoplay playsinline webkit-playsinline preload="auto" aria-hidden="true"></video>
  <div class="wash"></div>

  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <div class="nav">
    <a class="brand" href="/">
      <svg width="38" height="38" viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="navSun" cx="50%" cy="55%" r="55%"><stop offset="0" stop-color="#F2B84B"></stop><stop offset="1" stop-color="#C4562F"></stop></radialGradient></defs><circle cx="60" cy="60" r="44" fill="url(#navSun)"></circle></svg>
      <span>WIN<br>YOUR<br>MORNING</span>
    </a>
    <div class="nav-links">
      <a class="nav-cta" href="https://apps.apple.com/ca/app/win-your-morning/id6791211875">Get the app</a>
    </div>
  </div>

  <div class="frame">
    <div class="content">
      <h1>win your<br>morning.</h1>
      <svg class="squiggle" width="420" height="24" viewBox="0 0 420 24" fill="none" stroke="#E0A032" stroke-width="9" stroke-linecap="round" aria-hidden="true"><path d="M6 15 Q 42 5 78 13 T 150 13 T 222 13 T 294 13 T 366 12 T 414 11"></path></svg>

      <p class="tagline">wake up with your friends.</p>

      <a class="appstore" href="https://apps.apple.com/ca/app/win-your-morning/id6791211875">
        <svg viewBox="0 0 24 28" fill="currentColor" aria-hidden="true"><path d="M17.05 14.86c.02 2.62 2.3 3.49 2.33 3.5-.02.06-.37 1.26-1.21 2.5-.73 1.07-1.49 2.13-2.69 2.15-1.17.02-1.55-.69-2.89-.69-1.34 0-1.76.67-2.87.71-1.15.04-2.03-1.15-2.77-2.21-1.61-2.33-2.84-6.58-1.19-9.45.82-1.43 2.28-2.33 3.87-2.35 1.13-.02 2.2.76 2.89.76.69 0 1.99-.94 3.36-.8.57.02 2.17.21 3.2 1.72-.08.05-1.91 1.12-1.9 3.34M14.9 5.36c.61-.74 1.02-1.77.91-2.79-.88.04-1.94.59-2.57 1.32-.56.65-1.05 1.7-.92 2.7.98.08 1.97-.5 2.58-1.23"></path></svg>
        <span class="as-stack">
          <span class="as-pre">Download on the</span>
          <span class="as-name">App Store</span>
        </span>
      </a>
    </div>
  </div>
</section>

<script>
/* ── Hero video ───────────────────────────────────────────────────────────
   Coming back from the iOS home screen leaves this video wedged in one of two
   different ways, and they need different cures:

     a) It is simply PAUSED. iOS stops background media and never restarts it.
        play() fixes that — but the first call after returning is usually
        rejected, because the page is visible before it is fully foregrounded.
        So retry on a backoff rather than firing once and swallowing the error.

     b) It is still "playing" — paused is false, currentTime advances — but the
        PICTURE is frozen, because iOS came back with a stale compositing layer.
        No amount of play()/load() on that node repaints it. Only a brand new
        element, which gets a brand new layer, clears it.

   Since (b) reports itself as healthy, we cannot detect it by asking the
   element how it is doing. So the return handler tries the cheap fix and then
   VERIFIES it: if the clock has not moved a beat later, the node is wedged and
   we rebuild it. The clip is an ambient sky loop with no beat to lose, so
   restarting it from the top costs nothing a viewer would notice. */
(function () {
  // ?v= is the CACHE-BUSTER, not decoration: the file name never changes, so
  // without it everyone who has already loaded the page keeps the old clip out
  // of their browser cache. Bump it whenever assets/hero.mp4 is replaced.
  var HERO_SRC = 'assets/hero.mp4?v=2';
  var v = document.getElementById('heroVid');
  if (!v) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var tries = 0;

  function play() {
    if (document.hidden || !v) return;
    if (v.readyState === 0) { try { v.load(); } catch (e) {} }
    var p = v.play();
    if (p && p.catch) {
      p.catch(function () {
        if (tries++ < 8) setTimeout(play, 150 + tries * 150);
      });
    }
  }

  function wire() {
    v.addEventListener('canplay', play);
    v.addEventListener('loadeddata', play);
    // Catch-all for case (a): rather than enumerating every way iOS can stop
    // playback, notice the paused state itself and undo it.
    v.addEventListener('pause', function () {
      if (!document.hidden) setTimeout(play, 120);
    });
  }

  // Case (b): a fresh node, so the compositor has no stale layer to reuse.
  function rebuild() {
    var fresh = document.createElement('video');
    fresh.id = v.id;
    fresh.className = v.className;
    fresh.muted = true;
    fresh.defaultMuted = true;
    fresh.loop = true;
    fresh.autoplay = true;
    fresh.setAttribute('playsinline', '');
    fresh.setAttribute('webkit-playsinline', '');
    fresh.setAttribute('preload', 'auto');
    fresh.setAttribute('aria-hidden', 'true');
    v.parentNode.replaceChild(fresh, v);
    v = fresh;
    wire();
    v.src = HERO_SRC;
    try { v.load(); } catch (e) {}
    tries = 0;
    play();
  }

  function onReturn() {
    if (document.hidden) return;
    tries = 0;
    var before = v.currentTime;
    play();
    setTimeout(function () {
      if (document.hidden || !v) return;
      // Clock never moved, or it is sitting paused despite the retries — wedged.
      if (v.paused || v.currentTime === before) rebuild();
    }, 700);
  }

  wire();
  v.src = HERO_SRC;
  play();

  // Each is a different way back onto the page: visibilitychange for a tab or
  // app switch, pageshow for a bfcache restore (which fires no visibility
  // change at all), focus for the window regaining it.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) onReturn(); });
  window.addEventListener('pageshow', onReturn);
  window.addEventListener('focus', onReturn);

  // Last resort: if iOS refuses every programmatic play, a touch is a gesture,
  // and a gesture is always allowed to start playback.
  ['touchstart', 'click'].forEach(function (evt) {
    document.addEventListener(evt, function () { tries = 0; play(); }, { passive: true });
  });
})();

/* ── Page-view ping ───────────────────────────────────────────────────────
   This GET is what writes `page_views` on the backend, and the ?src= channel tag
   rides on it. Fire-and-forget: no UI depends on the response. */
(function () {
  var API = 'https://bdwaqpnycvywhhuzhlga.supabase.co/functions/v1/waitlist';
  var src = new URLSearchParams(location.search).get('src');
  try {
    fetch(API + (src ? '?src=' + encodeURIComponent(src) : ''), { cache: 'no-store' })
      .catch(function () {});
  } catch (e) {}
})();
</script>
</body>
</html>
